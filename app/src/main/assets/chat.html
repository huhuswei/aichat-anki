<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 聊天</title>

    <!-- 先加载所有依赖库 -->
    <!-- Marked -->
    <script src="https://g.alicdn.com/code/lib/marked/4.0.2/marked.min.js"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://g.alicdn.com/code/lib/KaTeX/0.16.9/katex.min.css">
    <script src="https://g.alicdn.com/code/lib/KaTeX/0.16.9/katex.min.js"></script>
    <script src="https://g.alicdn.com/code/lib/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://g.alicdn.com/code/lib/highlight.js/11.9.0/styles/monokai.css" id="hljs-light">
    <link rel="stylesheet" href="https://g.alicdn.com/code/lib/highlight.js/11.9.0/styles/monokai-sublime.css" id="hljs-dark" disabled>
    <script src="https://g.alicdn.com/code/lib/highlight.js/11.8.0/highlight.min.js"></script>
    <!-- 添加常用语言支持 -->
    <script src="https://g.alicdn.com/code/lib/highlight.js/11.8.0/languages/java.min.js"></script>
    <script src="https://g.alicdn.com/code/lib/highlight.js/11.8.0/languages/python.min.js"></script>
    <script src="https://g.alicdn.com/code/lib/highlight.js/11.8.0/languages/javascript.min.js"></script>
    <script src="https://g.alicdn.com/code/lib/highlight.js/11.8.0/languages/xml.min.js"></script>
    <script src="https://g.alicdn.com/code/lib/highlight.js/11.8.0/languages/bash.min.js"></script>
    <script src="https://g.alicdn.com/code/lib/highlight.js/11.8.0/languages/json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.7.0/dist/mermaid.min.js"></script>

    <link rel="stylesheet" href="chat.css">

    <script>
        // 初始化检查
        window.addEventListener('load', function() {
            console.log('Window loaded');

            // ===== 主题检测 =====
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.getElementById('hljs-light').disabled = isDark;
            document.getElementById('hljs-dark').disabled = !isDark;

            if (typeof katex === 'undefined') {
                console.error('KaTeX not loaded');
            } else {
                console.log('KaTeX loaded');
            }
            if (typeof marked === 'undefined') {
                console.error('Marked not loaded');
            } else {
                console.log('Marked loaded');
            }
            if (typeof mermaid === 'undefined') {
                console.error('Mermaid not loaded');
            } else {
              // 定义深色模式的主题
              const darkTheme = {
                dark: {
                  background: '#0d1117',
                  primaryColor: '#3b82f6',
                  primaryTextColor: '#c9d1d9',
                  secondaryColor: '#4b5062',
                  tertiaryColor: '#2b2f38',
                  lineColor: '#6e7681'
                }
              };
              
              mermaid.initialize({
                theme: (isDark ? 'dark' : 'default'),
                themeVariables: isDark ? darkTheme.dark : undefined,
                startOnLoad: true,
                securityLevel: 'loose',
                flowchart: { curve: 'basis' },
                fontSize: 16,
                fontFamily: "'Segoe UI', 'Microsoft YaHei', sans-serif",
                htmlLabels: true,
                deterministicIds: true,
                useMaxWidth: true,
                fit: true,
                sequence: {
                  diagramMarginX: 50,
                  diagramMarginY: 10,
                  actorMargin: 50,
                  boxMargin: 10,
                  boxTextMargin: 5,
                  noteMargin: 10,
                  messageMargin: 35,
                  mirrorActors: true,
                  actorFontSize: 16,
                  actorFontFamily: "'Segoe UI', 'Microsoft YaHei', sans-serif",
                  actorFontWeight: "normal"
                },
                gantt: {
                  titleTopMargin: 25,
                  barHeight: 20,
                  barGap: 4,
                  topPadding: 50,
                  leftPadding: 75,
                  rightPadding: 20,
                  bottomPadding: 50,
                }
              });
              setTimeout(function() {
                try {
                  mermaid.init();
                  console.log('Mermaid initialized');
                } catch (error) {
                  console.error('Mermaid initialization error:', error);
                }
              }, 100);
              console.log('Mermaid loaded');
            }
        });
    </script>
    
    <style>

    </style>
</head>
<body>
    <div id="chat-container"></div>
    <div id="input-container">
        <div class="input-area">
            <textarea id="message-input" placeholder="输入消息..." rows="1"></textarea>
            <div class="button-container">
                <button id="send-button" class="action-button">发送</button>
                <button id="interruptBtn" class="action-button interrupt-btn" style="display: none;">停止生成</button>
            </div>
        </div>
        <div class="button-group">
            <button id="new-session-btn" class="session-btn">新会话</button>
            <button id="show-sessions-btn" class="session-btn">历史会话</button>
            <button id="toggle-mode-button" class="session-btn">
                <span id="mode-indicator">多轮对话</span>
            </button>
        </div>
    </div>

    <!-- 修改会话列表对话框 -->
    <div id="sessions-modal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title">历史会话</h3>
            <button class="modal-close">&times;</button>
            <div class="search-box">
                <input type="text" id="session-search" placeholder="搜索会话...">
            </div>
            <div id="sessions-list"></div>
        </div>
    </div>

    <script src="chat.js"></script>
    <script src="mermaid-mobile.js"></script>
</body>
</html>
